name: api-tests
on:
  push:
    paths: ["apps/api/**", ".github/workflows/api-tests.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-tests.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest
