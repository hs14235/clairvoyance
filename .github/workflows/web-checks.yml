name: web-checks
on:
  push:
    paths: ["apps/web/**", ".github/workflows/web-checks.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-checks.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
